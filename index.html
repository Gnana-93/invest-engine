<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 3rem 4rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #1a1a2e;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome! 👋</h1>
    <p>This is your new welcome page. Edit <strong>index.html</strong> to start building something great.</p>
  </main>
</body>
</html>
